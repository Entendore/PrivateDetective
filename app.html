<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALTER &amp; PAGE — Field Forensics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0c0d10;
      --panel: #15171c;
      --panel2: #1b1e24;
      --line: #2a2e37;
      --line2: #22252c;
      --text: #c9cdd6;
      --dim: #7d8595;
      --amber: #e2a94f;
      --amber-hi: #f0c070;
      --red: #d0564a;
      --paper: #e9e1cd;
      --paper-ink: #2b2620;
      --paper-dim: #6f6353;
      --term: #e3ae52;
    }

    body.tint-green {
      --amber: #7fd98c;
      --amber-hi: #a9f0b3;
      --term: #7fd98c
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      overflow: hidden;
      user-select: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    ::selection {
      background: var(--amber);
      color: #141109
    }

    .ic {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    #crt {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .15) 0 1px, transparent 1px 3px)
    }

    body.noscan #crt {
      display: none
    }

    #vig {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9989;
      background: radial-gradient(115% 95% at 50% 38%, transparent 55%, rgba(0, 0, 0, .45) 100%)
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      z-index: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--dim)
    }

    .brand .sq {
      width: 10px;
      height: 10px;
      background: var(--amber)
    }

    .brand b {
      color: var(--text);
      font-weight: 700
    }

    #tb-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px
    }

    #saveflash {
      font-size: 9px;
      letter-spacing: .24em;
      color: #4a5060;
      opacity: 0;
      transition: opacity .25s
    }

    #saveflash.show {
      opacity: 1
    }

    #clock {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: .1em
    }

    .btn {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      line-height: 1.2
    }

    .btn:hover {
      border-color: var(--amber);
      color: var(--amber)
    }

    .btn:active {
      transform: translate(1px, 1px)
    }

    .btn.primary {
      background: var(--amber);
      border-color: var(--amber);
      color: #181207;
      font-weight: 700
    }

    .btn.primary:hover {
      background: var(--amber-hi);
      color: #181207
    }

    .btn.danger:hover {
      border-color: var(--red);
      color: var(--red)
    }

    .btn:disabled {
      opacity: .4;
      cursor: default;
      pointer-events: none
    }

    .ibtn {
      width: 26px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      background: none;
      color: var(--dim);
      cursor: pointer
    }

    .ibtn:hover {
      color: var(--amber);
      border-color: var(--line)
    }

    #desktop {
      position: fixed;
      inset: 36px 0 42px 0
    }

    #watermark {
      position: absolute;
      right: 26px;
      bottom: 16px;
      text-align: right;
      pointer-events: none;
      line-height: 1
    }

    #watermark .wm-n {
      font-family: 'VT323', monospace;
      font-size: 170px;
      color: #15171d;
      letter-spacing: .04em
    }

    #watermark .wm-d {
      font-family: 'Special Elite', serif;
      font-size: 14px;
      color: #22252c;
      letter-spacing: .3em;
      margin-top: -30px
    }

    #icons {
      position: absolute;
      top: 20px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 96px
    }

    .dicon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 7px 4px;
      cursor: pointer;
      border: 1px solid transparent
    }

    .dicon .ic {
      width: 24px;
      height: 24px;
      color: var(--dim)
    }

    .dicon span {
      font-size: 10px;
      letter-spacing: .08em;
      color: var(--dim);
      text-align: center
    }

    .dicon:hover .ic,
    .dicon:hover span {
      color: var(--text)
    }

    .dicon.sel {
      border-color: var(--amber);
      background: rgba(226, 169, 79, .07)
    }

    .dicon.sel .ic,
    .dicon.sel span {
      color: var(--amber)
    }

    .ctxmenu {
      position: fixed;
      z-index: 820;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 6px 7px 0 rgba(0, 0, 0, .45);
      min-width: 200px;
      animation: winIn .1s ease-out
    }

    .ctxmenu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      font-size: 11px;
      letter-spacing: .08em;
      border: none;
      background: none;
      color: var(--text);
      cursor: pointer;
      text-transform: uppercase
    }

    .ctxmenu button:hover {
      background: rgba(226, 169, 79, .09);
      color: var(--amber)
    }

    .ctxmenu button.dis {
      opacity: .4;
      pointer-events: none
    }

    .ctxmenu .sep {
      height: 1px;
      background: var(--line2)
    }

    #winlayer {
      position: absolute;
      inset: 0
    }

    .win {
      position: absolute;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 7px 9px 0 rgba(0, 0, 0, .4), 0 30px 70px -30px rgba(0, 0, 0, .85);
      display: flex;
      flex-direction: column;
      min-width: 280px;
      min-height: 200px;
      animation: winIn .13s ease-out
    }

    @keyframes winIn {
      from {
        transform: scale(.985);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .win.max .rz {
      display: none
    }

    .titlebar {
      height: 32px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px 0 10px;
      background: var(--panel2);
      border-bottom: 1px solid var(--line);
      cursor: grab
    }

    .titlebar:active {
      cursor: grabbing
    }

    .t-ic {
      color: var(--dim);
      display: flex
    }

    .t-title {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--dim);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1
    }

    .win.active .t-title {
      color: var(--amber)
    }

    .t-btns {
      display: flex;
      gap: 2px
    }

    .t-btns .ibtn.close:hover {
      color: var(--red);
      border-color: var(--red)
    }

    .rz {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 17px;
      height: 17px;
      cursor: nwse-resize;
      z-index: 5;
      background: linear-gradient(135deg, transparent 0 48%, var(--line) 48% 56%, transparent 56% 72%, var(--line) 72% 80%, transparent 80%)
    }

    .win-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    /* ---- file manager ---- */
    .fm {
      display: flex;
      flex-direction: column;
      height: 100%
    }

    .fm-tools {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-bottom: 1px solid var(--line2);
      background: var(--panel)
    }

    .crumb {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 2px;
      overflow: hidden;
      white-space: nowrap;
      border: 1px solid var(--line2);
      background: #101216;
      padding: 5px 8px;
      font-size: 11px;
      color: var(--dim)
    }

    .crumb a {
      color: var(--text);
      cursor: pointer;
      text-decoration: none
    }

    .crumb a:hover {
      color: var(--amber)
    }

    .crumb .sep {
      color: #3a3f4b;
      margin: 0 4px
    }

    .fm-main {
      flex: 1;
      min-height: 0;
      display: flex
    }

    .fm-tree {
      width: 198px;
      flex: none;
      border-right: 1px solid var(--line2);
      overflow: auto;
      padding: 8px 4px;
      background: #121419
    }

    .fm-list {
      flex: 1;
      min-width: 0;
      overflow: auto
    }

    .tnode {
      cursor: pointer
    }

    .trow {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 6px;
      color: var(--dim);
      white-space: nowrap
    }

    .trow:hover {
      color: var(--text)
    }

    .tnode.sel>.trow {
      background: rgba(226, 169, 79, .1);
      color: var(--amber)
    }

    .trow .chev {
      width: 12px;
      height: 12px;
      transition: transform .12s;
      color: #4a5060
    }

    .tnode.open>.trow .chev {
      transform: rotate(90deg)
    }

    .tkids {
      display: none
    }

    .tnode.open>.tkids {
      display: block
    }

    .lhead,
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px 68px 86px;
      gap: 8px;
      align-items: center;
      padding: 4px 10px
    }

    .lhead {
      position: sticky;
      top: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--line2);
      font-size: 10px;
      letter-spacing: .14em;
      color: #565d6e;
      z-index: 2
    }

    .row {
      cursor: pointer;
      border-bottom: 1px solid #191c22
    }

    .row:hover {
      background: #191c23
    }

    .row.sel {
      background: rgba(226, 169, 79, .09);
      box-shadow: inset 2px 0 0 var(--amber)
    }

    .row .ic {
      color: var(--dim)
    }

    .row.sel .ic {
      color: var(--amber)
    }

    .r-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .row.pinned .r-name {
      color: var(--amber)
    }

    .pinned-ic {
      width: 11px;
      height: 11px;
      color: var(--amber)
    }

    .r-kind,
    .r-size,
    .r-date {
      font-size: 10px;
      color: #5b6273;
      letter-spacing: .06em
    }

    .r-kind.sealed {
      color: var(--amber)
    }

    .fm-foot {
      flex: none;
      border-top: 1px solid var(--line2);
      padding: 6px 10px;
      font-size: 10px;
      letter-spacing: .1em;
      color: #565d6e;
      display: flex;
      justify-content: space-between
    }

    .fm-empty {
      padding: 30px;
      color: #4a5060;
      font-size: 11px;
      letter-spacing: .1em;
      text-align: center
    }

    /* ---- documents ---- */
    .viewer {
      display: flex;
      flex-direction: column;
      height: 100%
    }

    .v-tools {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line2);
      background: var(--panel);
      flex-wrap: wrap
    }

    .v-path {
      flex: 1;
      font-size: 10px;
      color: #565d6e;
      letter-spacing: .06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .v-scroll {
      flex: 1;
      overflow: auto;
      user-select: text
    }

    .doc {
      padding: 28px 32px;
      white-space: pre-wrap;
      min-height: 100%
    }

    .doc.paper {
      background: var(--paper);
      color: var(--paper-ink);
      font-family: 'Special Elite', serif;
      font-size: 14.5px;
      line-height: 1.8;
      box-shadow: inset 0 0 70px rgba(90, 70, 35, .09)
    }

    .doc.mono {
      background: #0f1114;
      color: #c4c9d4;
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7
    }

    .doc.mono .dimline {
      color: #5d6472
    }

    .ev-chip {
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--amber);
      border: 1px solid var(--amber);
      padding: 4px 9px;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap
    }

    .ev-wait {
      font-size: 10px;
      letter-spacing: .08em;
      color: #565d6e;
      white-space: nowrap
    }

    .mailhead {
      background: #101216;
      border-bottom: 1px solid var(--line2);
      padding: 14px 18px;
      font-size: 12px;
      line-height: 1.9
    }

    .mailhead .mh-row {
      display: flex;
      gap: 12px
    }

    .mailhead .mh-k {
      color: #565d6e;
      width: 52px;
      flex: none;
      font-size: 10px;
      letter-spacing: .14em;
      padding-top: 2px
    }

    .mailhead .mh-v {
      color: var(--text)
    }

    .mailhead .subj {
      color: var(--amber);
      font-weight: 700
    }

    .mailbody {
      font-family: 'Special Elite', serif;
      font-size: 14.5px;
      line-height: 1.8;
      color: var(--paper-ink);
      background: var(--paper);
      padding: 24px 30px;
      white-space: pre-wrap;
      box-shadow: inset 0 0 70px rgba(90, 70, 35, .09)
    }

    .chatlog {
      background: #0f1114;
      padding: 18px 20px;
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      line-height: 2.05
    }

    .chat-line {
      display: flex;
      gap: 10px
    }

    .chat-t {
      color: #4a5060;
      flex: none;
      width: 56px
    }

    .chat-who {
      flex: none;
      width: 64px;
      font-weight: 700
    }

    .w-a {
      color: var(--amber)
    }

    .w-b {
      color: #9fb0c8
    }

    .chat-msg {
      color: #c4c9d4
    }

    .csvwrap {
      padding: 18px;
      background: #0f1114;
      min-height: 100%
    }

    .csvwrap table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px
    }

    .csvwrap td,
    .csvwrap th {
      border: 1px solid #262a32;
      padding: 6px 10px;
      text-align: left
    }

    .csvwrap th {
      background: #15171c;
      color: var(--amber);
      font-size: 10px;
      letter-spacing: .12em
    }

    .csvwrap td {
      color: #c4c9d4
    }

    .imgwrap {
      padding: 20px 20px 8px;
      display: flex;
      justify-content: center;
      background: #0a0b0d
    }

    .imgwrap img {
      max-width: 100%;
      border: 1px solid var(--line2);
      cursor: zoom-in;
      transition: max-width .15s
    }

    .imgwrap img.zoomed {
      max-width: none;
      width: 150%;
      cursor: zoom-out
    }

    .imginfo {
      margin: 14px 20px 18px;
      border: 1px solid var(--line2);
      background: #101216;
      padding: 12px 14px;
      font-size: 11.5px;
      line-height: 1.8;
      color: var(--dim);
      display: none
    }

    .imginfo.show {
      display: block
    }

    .imginfo.uv {
      border-color: #4a4130
    }

    .imginfo .cap {
      color: var(--text);
      font-family: 'Special Elite', serif;
      font-size: 13px
    }

    .imginfo .meta {
      margin-top: 6px
    }

    .imginfo .uvl {
      color: var(--amber);
      margin-top: 4px
    }

    .audio {
      padding: 20px 22px;
      font-family: 'Space Mono', monospace;
      min-height: 100%;
      background: #0e1013
    }

    .a-head {
      display: flex;
      align-items: baseline;
      gap: 12px
    }

    .a-title {
      font-family: 'Special Elite', serif;
      font-size: 16px;
      color: var(--text)
    }

    .a-dur {
      font-size: 10px;
      color: #565d6e;
      letter-spacing: .14em
    }

    .wave {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 58px;
      margin: 14px 0;
      padding: 10px;
      background: #0a0c0f;
      border: 1px solid var(--line2)
    }

    .wave span {
      width: 4px;
      background: #3a4050;
      transform-origin: bottom
    }

    .wave.playing span {
      animation: eq .5s ease-in-out infinite alternate;
      background: var(--amber)
    }

    @keyframes eq {
      from {
        transform: scaleY(.35)
      }

      to {
        transform: scaleY(1.3)
      }
    }

    .a-trans {
      margin-top: 2px;
      background: #0a0c0f;
      border: 1px solid var(--line2);
      padding: 12px 14px;
      min-height: 160px;
      font-size: 12.5px;
      line-height: 1.95;
      max-height: 240px;
      overflow: auto
    }

    .a-line {
      display: flex;
      gap: 12px;
      color: #565d6e
    }

    .a-line.on {
      color: #c4c9d4
    }

    .a-t {
      width: 44px;
      text-align: right;
      flex: none;
      color: #4a5060;
      font-size: 11px;
      padding-top: 2px
    }

    .a-ctrl {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px
    }

    .a-prog {
      flex: 1;
      height: 9px;
      background: #0a0c0f;
      border: 1px solid var(--line2)
    }

    .a-prog i {
      display: block;
      height: 100%;
      background: var(--amber);
      width: 0
    }

    .a-time {
      font-size: 11px;
      color: #565d6e
    }

    .frag {
      padding: 22px 24px;
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      line-height: 1.85;
      background: #0f1114;
      min-height: 100%
    }

    .fmeta {
      color: #565d6e;
      font-size: 10px;
      letter-spacing: .16em;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px
    }

    .fline {
      white-space: pre-wrap;
      color: #c4c9d4;
      min-height: 1.85em
    }

    .blk {
      white-space: pre;
      color: #2c313d;
      letter-spacing: 2px;
      min-height: 1.85em
    }

    .lockbox {
      margin: auto;
      max-width: 320px;
      text-align: center;
      padding: 30px 10px
    }

    .lockbox .ic {
      width: 34px;
      height: 34px;
      color: var(--amber);
      margin-bottom: 14px
    }

    .lockbox h3 {
      font-size: 12px;
      letter-spacing: .22em;
      color: var(--amber);
      margin-bottom: 6px
    }

    .lockbox p {
      color: var(--dim);
      font-size: 11.5px;
      line-height: 1.7;
      margin-bottom: 16px
    }

    .lockbox input {
      width: 100%;
      background: #0f1114;
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 9px 12px;
      text-align: center;
      letter-spacing: .1em;
      outline: none
    }

    .lockbox input:focus {
      border-color: var(--amber)
    }

    .lockerr {
      color: var(--red);
      font-size: 11px;
      margin-top: 10px;
      min-height: 16px;
      letter-spacing: .06em
    }

    .shake {
      animation: shake .3s
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    /* ---- interrogation room ---- */
    .inr {
      display: flex;
      height: 100%
    }

    .inr-side {
      width: 190px;
      flex: none;
      border-right: 1px solid var(--line2);
      overflow: auto;
      background: #121419
    }

    .susrow {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #191c22
    }

    .susrow:hover {
      background: #191c23
    }

    .susrow.sel {
      background: rgba(226, 169, 79, .09);
      box-shadow: inset 2px 0 0 var(--amber)
    }

    .susrow .nm {
      color: var(--text);
      font-size: 12px
    }

    .susrow.sel .nm {
      color: var(--amber)
    }

    .susrow .st {
      font-size: 9px;
      letter-spacing: .16em;
      color: #565d6e;
      margin-top: 3px
    }

    .st.press {
      color: var(--amber)
    }

    .st.crack {
      color: var(--red)
    }

    .st.clear {
      color: #8fbf7a
    }

    .inr-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .inr-head {
      flex: none;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line2);
      display: flex;
      gap: 12px;
      align-items: center
    }

    .avatar {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      background: var(--panel2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Special Elite', serif;
      font-size: 18px;
      color: var(--amber);
      flex: none
    }

    .inr-name {
      font-family: 'Special Elite', serif;
      font-size: 17px;
      color: var(--text)
    }

    .inr-desc {
      font-size: 10.5px;
      color: var(--dim);
      line-height: 1.5;
      margin-top: 2px
    }

    .meter {
      margin-left: auto;
      text-align: right;
      flex: none
    }

    .meter .lbl {
      font-size: 9px;
      letter-spacing: .2em;
      color: #565d6e;
      margin-bottom: 4px
    }

    .meter .blocks {
      display: flex;
      gap: 3px;
      justify-content: flex-end
    }

    .meter .blocks i {
      width: 16px;
      height: 8px;
      background: #262a32;
      border: 1px solid var(--line2)
    }

    .meter .blocks i.on {
      background: var(--amber);
      border-color: var(--amber)
    }

    .inr-trans {
      flex: 1;
      overflow: auto;
      padding: 14px 16px;
      background: #0f1114;
      user-select: text
    }

    .dlg {
      margin-bottom: 12px;
      max-width: 94%
    }

    .dlg .who {
      font-size: 9px;
      letter-spacing: .2em;
      color: #565d6e;
      margin-bottom: 3px
    }

    .dlg.det .who {
      color: var(--amber)
    }

    .dlg .txt {
      font-family: 'Special Elite', serif;
      font-size: 13.5px;
      line-height: 1.65;
      color: #c4c9d4;
      white-space: pre-wrap
    }

    .dlg.det .txt {
      color: var(--text)
    }

    .dlg.sys .txt {
      color: #7d8595;
      font-family: 'Space Mono', monospace;
      font-size: 11.5px;
      letter-spacing: .04em
    }

    .dlg.crk .who {
      color: var(--red)
    }

    .dlg.crk .txt {
      color: #e0a49c
    }

    .inr-tray {
      flex: none;
      border-top: 1px solid var(--line2);
      padding: 10px 12px;
      max-height: 168px;
      overflow: auto
    }

    .inr-tray .lbl {
      font-size: 9px;
      letter-spacing: .2em;
      color: #565d6e;
      margin-bottom: 7px
    }

    .evchip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .evbtn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .05em;
      padding: 5px 9px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--dim);
      cursor: pointer;
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .evbtn:hover {
      border-color: var(--amber);
      color: var(--amber)
    }

    .evbtn.dis {
      opacity: .35;
      pointer-events: none;
      text-decoration: line-through
    }

    .inr-empty {
      padding: 26px;
      text-align: center;
      color: #4a5060;
      font-size: 11px;
      letter-spacing: .1em;
      line-height: 2
    }

    /* ---- plea desk ---- */
    .pd {
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .pd-tabs {
      flex: none;
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line2)
    }

    .pd-tab {
      flex: 1;
      text-align: left;
      padding: 9px 12px;
      font-size: 11px;
      letter-spacing: .08em;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--dim);
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace
    }

    .pd-tab:hover {
      color: var(--amber)
    }

    .pd-tab.sel {
      color: var(--amber);
      border-color: var(--amber)
    }

    .pd-tab .r {
      display: block;
      font-size: 9px;
      letter-spacing: .16em;
      margin-top: 2px;
      color: #565d6e;
      text-transform: none
    }

    .pd-body {
      flex: 1;
      overflow: auto;
      padding: 16px 18px;
      user-select: text
    }

    .pd-name {
      font-family: 'Special Elite', serif;
      font-size: 18px;
      color: var(--text)
    }

    .pd-role {
      font-size: 11px;
      color: var(--dim);
      margin: 3px 0 12px;
      line-height: 1.6
    }

    .gauge {
      margin-bottom: 10px
    }

    .gauge .gl {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: .18em;
      color: #565d6e;
      margin-bottom: 4px
    }

    .gauge .bar {
      height: 10px;
      background: #0a0c0f;
      border: 1px solid var(--line2)
    }

    .gauge .bar i {
      display: block;
      height: 100%;
      background: var(--amber);
      transition: width .3s
    }

    .gauge.heat .bar i {
      background: var(--red)
    }

    .pd-stance {
      font-size: 10px;
      letter-spacing: .2em;
      padding: 5px 0;
      margin: 4px 0 12px
    }

    .pd-stance.k-ease {
      color: #565d6e
    }

    .pd-stance.k-press {
      color: var(--amber)
    }

    .pd-stance.k-crack {
      color: var(--red)
    }

    .pd-lbl {
      font-size: 9px;
      letter-spacing: .2em;
      color: #565d6e;
      margin: 14px 0 7px
    }

    .pd-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .pd-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 14px 0 4px;
      flex-wrap: wrap
    }

    .mtx {
      border-collapse: collapse;
      width: 100%;
      font-size: 11px;
      margin-top: 8px
    }

    .mtx th,
    .mtx td {
      border: 1px solid var(--line2);
      padding: 6px 8px;
      text-align: center;
      color: var(--dim)
    }

    .mtx th {
      background: var(--panel2);
      font-size: 9px;
      letter-spacing: .12em
    }

    .mtx td.hl {
      background: rgba(226, 169, 79, .14);
      color: var(--amber);
      border-color: var(--amber);
      font-weight: 700
    }

    .pd-note {
      font-family: 'Special Elite', serif;
      color: var(--paper-ink);
      background: var(--paper);
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.65;
      margin-top: 12px;
      box-shadow: inset 0 0 40px rgba(90, 70, 35, .08)
    }

    .pd-reveal {
      border: 1px solid var(--line2);
      background: #101216;
      padding: 12px 14px;
      margin-top: 14px
    }

    .pd-reveal h4 {
      font-size: 11px;
      letter-spacing: .22em;
      color: var(--amber);
      margin-bottom: 8px
    }

    .pd-reveal .rl {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      font-family: 'Special Elite', serif;
      margin-bottom: 6px
    }

    .pd-done {
      border: 1px solid #4a4130;
      color: var(--amber);
      font-size: 10px;
      letter-spacing: .16em;
      padding: 6px 10px;
      display: inline-block
    }

    /* ---- timeline ---- */
    .tlwrap {
      height: 100%;
      overflow: auto;
      user-select: text
    }

    .tl {
      padding: 26px 30px;
      background: var(--paper);
      color: var(--paper-ink);
      font-family: 'Special Elite', serif;
      font-size: 13.5px;
      line-height: 1.65;
      min-height: 100%;
      box-shadow: inset 0 0 60px rgba(90, 70, 35, .08)
    }

    .tl h3 {
      font-size: 16px;
      letter-spacing: .05em;
      margin-bottom: 3px
    }

    .tl .tl-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--paper-dim);
      letter-spacing: .16em;
      margin-bottom: 16px
    }

    .tl-line {
      display: flex;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px dashed #cfc2a4
    }

    .tl-when {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      color: #8a6a2f;
      width: 116px;
      flex: none;
      padding-top: 3px
    }

    .tl-body {
      flex: 1
    }

    .tl-body b {
      display: block;
      font-size: 13px
    }

    .tl-body p {
      margin: 2px 0 0;
      color: #4d4335;
      font-size: 12px;
      line-height: 1.55
    }

    .tl-body .p {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: #8d7f66;
      margin-top: 5px;
      word-break: break-all
    }

    .tl-undated {
      margin-top: 18px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--paper-dim)
    }

    .tl-empty {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--paper-dim);
      letter-spacing: .06em;
      line-height: 2.1
    }

    /* ---- case file ---- */
    .cf {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative
    }

    .cf-head {
      flex: none;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--line2);
      display: flex;
      align-items: baseline;
      gap: 14px;
      background: var(--panel)
    }

    .cf-no {
      font-size: 10px;
      letter-spacing: .24em;
      color: var(--dim)
    }

    .cf-title {
      font-family: 'Special Elite', serif;
      font-size: 21px;
      color: var(--text);
      flex: 1
    }

    .chip {
      font-size: 9px;
      letter-spacing: .2em;
      padding: 4px 9px;
      border: 1px solid var(--line)
    }

    .chip.open {
      color: var(--amber);
      border-color: var(--amber)
    }

    .chip.closed {
      color: var(--red);
      border-color: var(--red)
    }

    .cf-body {
      flex: 1;
      overflow: auto;
      padding: 18px 20px 26px;
      user-select: text;
      position: relative
    }

    .cf-label {
      font-size: 10px;
      letter-spacing: .24em;
      color: #565d6e;
      margin: 20px 0 9px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .cf-label:first-child {
      margin-top: 0
    }

    .cf-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line2)
    }

    .cf-brief {
      font-family: 'Special Elite', serif;
      font-size: 14px;
      line-height: 1.85;
      color: var(--paper-ink);
      background: var(--paper);
      padding: 20px 24px;
      box-shadow: inset 0 0 60px rgba(90, 70, 35, .08)
    }

    .cf-brief .method {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      color: var(--paper-dim);
      letter-spacing: .06em;
      margin-top: 14px;
      border-top: 1px dashed #c9bda2;
      padding-top: 10px
    }

    .suspect {
      display: flex;
      gap: 12px;
      padding: 9px 2px;
      border-bottom: 1px solid var(--line2);
      align-items: baseline;
      cursor: pointer
    }

    .suspect b {
      color: var(--amber);
      font-size: 12.5px;
      width: 130px;
      flex: none
    }

    .suspect span {
      color: var(--dim);
      font-size: 11.5px;
      line-height: 1.6
    }

    .suspect .tagchip {
      margin-left: auto;
      flex: none;
      font-size: 9px;
      letter-spacing: .16em;
      padding: 2px 7px;
      border: 1px solid var(--line);
      color: #565d6e
    }

    .suspect.t-prime .tagchip {
      color: var(--red);
      border-color: var(--red)
    }

    .suspect.t-prime b {
      color: var(--red)
    }

    .suspect.t-cleared .tagchip {
      color: #8fbf7a;
      border-color: #3d5a38
    }

    .hintitem {
      border-left: 2px solid var(--amber);
      padding: 6px 12px;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 12px;
      line-height: 1.7;
      background: #12141a
    }

    .cf-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .cf-note {
      font-size: 11px;
      color: var(--dim)
    }

    .verdict {
      border-left: 3px solid var(--red);
      background: #141518;
      padding: 16px 18px;
      margin-top: 14px;
      font-family: 'Special Elite', serif;
      font-size: 14px;
      line-height: 1.85;
      color: var(--text)
    }

    .stamp {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-9deg);
      border: 3px solid var(--red);
      outline: 2px solid var(--red);
      outline-offset: 5px;
      color: var(--red);
      padding: 10px 28px;
      text-align: center;
      font-weight: 700;
      letter-spacing: .34em;
      font-size: 27px;
      opacity: .93;
      background: rgba(30, 10, 10, .12);
      pointer-events: none;
      z-index: 5
    }

    .stamp small {
      display: block;
      font-size: 9px;
      letter-spacing: .3em;
      font-weight: 400;
      margin-top: 5px
    }

    .stamp.animate {
      animation: stampIn .42s cubic-bezier(.15, .85, .3, 1.15) both
    }

    @keyframes stampIn {
      0% {
        transform: translate(-50%, -50%) rotate(-9deg) scale(2.7);
        opacity: 0
      }

      60% {
        transform: translate(-50%, -50%) rotate(-9deg) scale(.94);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) rotate(-9deg) scale(1);
        opacity: .93
      }
    }

    .linkitem {
      border-left: 2px solid var(--red);
      background: #12141a;
      padding: 7px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.65;
      color: var(--text)
    }

    .linkitem .lno {
      color: var(--red);
      font-size: 9px;
      letter-spacing: .18em;
      display: block;
      margin-bottom: 2px
    }

    .linknone {
      font-size: 11px;
      color: #565d6e;
      letter-spacing: .06em;
      padding: 5px 2px;
      line-height: 1.6
    }

    /* ---- terminal ---- */
    .term {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0a0b0c
    }

    .term-out {
      flex: 1;
      overflow: auto;
      padding: 12px 14px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      line-height: 1.35;
      color: var(--term);
      white-space: pre-wrap;
      user-select: text
    }

    .term-out .tdim {
      color: #8a6f37
    }

    .term-out .terr {
      color: var(--red)
    }

    .term-out .techo {
      color: #b9bec9
    }

    .term-in {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--line2)
    }

    .term-in .ps1 {
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: var(--term);
      white-space: nowrap
    }

    .term-in input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--term);
      font-family: 'VT323', monospace;
      font-size: 18px;
      caret-color: var(--term)
    }

    /* ---- search / log / notes ---- */
    .search {
      display: flex;
      flex-direction: column;
      height: 100%
    }

    .s-bar {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line2)
    }

    .s-bar input {
      flex: 1;
      background: #0f1114;
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 8px 11px;
      outline: none;
      letter-spacing: .04em
    }

    .s-bar input:focus {
      border-color: var(--amber)
    }

    .s-info {
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: .14em;
      color: #565d6e;
      border-bottom: 1px solid var(--line2)
    }

    .s-res {
      flex: 1;
      overflow: auto
    }

    .s-item {
      padding: 9px 12px;
      border-bottom: 1px solid #191c22;
      cursor: pointer
    }

    .s-item:hover {
      background: #191c23
    }

    .s-path {
      font-size: 10px;
      color: #565d6e;
      letter-spacing: .08em;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .s-snip {
      font-size: 12px;
      color: var(--text);
      margin-top: 3px;
      line-height: 1.5;
      white-space: pre-wrap
    }

    .s-snip mark {
      background: var(--amber);
      color: #181207;
      padding: 0 2px
    }

    .s-sealed {
      color: var(--dim);
      font-style: italic
    }

    .s-empty {
      padding: 30px;
      text-align: center;
      color: #4a5060;
      font-size: 11px;
      letter-spacing: .12em;
      line-height: 2
    }

    .logapp {
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .l-list {
      flex: 1;
      overflow: auto;
      padding: 10px 12px
    }

    .l-item {
      display: flex;
      gap: 10px;
      padding: 7px 4px;
      border-bottom: 1px solid #191c22;
      font-size: 11.5px;
      line-height: 1.55
    }

    .l-time {
      color: #565d6e;
      flex: none;
      font-size: 10px;
      padding-top: 2px;
      width: 88px
    }

    .l-case {
      flex: none;
      font-size: 9px;
      border: 1px solid var(--line);
      padding: 1px 6px;
      color: var(--dim);
      height: fit-content;
      margin-top: 1px;
      letter-spacing: .1em
    }

    .l-item.gold .l-case {
      color: var(--amber);
      border-color: var(--amber)
    }

    .l-text {
      color: var(--text)
    }

    .l-empty {
      padding: 26px;
      text-align: center;
      color: #4a5060;
      font-size: 11px;
      letter-spacing: .12em
    }

    .notes {
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .n-bar {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line2);
      display: flex;
      gap: 8px;
      align-items: center
    }

    .n-list {
      flex: 1;
      overflow: auto;
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-content: flex-start
    }

    .n-card {
      width: 200px;
      background: #efe3b8;
      color: #3a3116;
      font-family: 'Special Elite', serif;
      padding: 12px;
      position: relative;
      box-shadow: 3px 4px 0 rgba(0, 0, 0, .4);
      transform: rotate(-.6deg);
      font-size: 13px;
      line-height: 1.6
    }

    .n-card:nth-child(2n) {
      transform: rotate(.7deg);
      background: #e7e9c8
    }

    .n-card textarea {
      width: 100%;
      min-height: 110px;
      background: transparent;
      border: none;
      outline: none;
      font: inherit;
      color: inherit;
      resize: vertical;
      white-space: pre-wrap
    }

    .n-card .nx {
      position: absolute;
      top: 2px;
      right: 6px;
      color: #8a7b46;
      cursor: pointer;
      font-family: 'Space Mono';
      font-size: 13px;
      padding: 2px 4px
    }

    .n-card .nx:hover {
      color: var(--red)
    }

    .n-empty {
      color: #4a5060;
      font-size: 11.5px;
      letter-spacing: .1em;
      padding: 10px
    }

    /* ---- taskbar / drawer / toasts ---- */
    #taskbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      z-index: 560;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      background: var(--panel);
      border-top: 1px solid var(--line)

    'use strict';
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
    const ic = (id, cls = 'ic') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
    const pad2 = n => String(n).padStart(2, '0');
    function fmtDur(ms) { const s = Math.max(1, Math.round(ms / 1000)); return Math.floor(s / 60) + 'm ' + pad2(s % 60) + 's'; }
    function hashStr(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

    function resolve(path) {

    function normPath(cwd, input) {
      let p = (input || '').trim(); if (!p) return cwd;
      if (!p.startsWith('/')) p = (cwd === '/' ? '' : cwd) + '/' + p;
      const parts = [];
      for (const seg of p.split('/')) { if (!seg || seg === '.') continue; if (seg === '..') { parts.pop(); continue; } parts.push(seg); }

    function fdate(path) { const c = CASE(); const d = (hashStr(path) % 27) + 1; return c.date + '-' + pad2(d); }
    function nodeBytes(n) {
      if (n.type === 'dir') return null;

      if (n.type === 'audio') return n.dur;

      if (n.type === 'chat') s = n.entries.map(e => e.join(' ')).join('');
      if (n.type === 'email') s = n.from + n.to + n.subject + n.body;

    function walkTree(node, path, cb) {

    function fileLines(node, name, path) {

        case 'chat': return node.entries.map(e => '[' + e[ 0 ] + '] ' + e[ 1 ] + ': ' + e[ 2 ]);
        case 'image': return [ node.info.caption, ...node.info.meta ];
        case 'audio': return [ node.title, ...node.lines.map(l => l[ 1 ]) ];
        case 'frag': return rec ? [ ...node.head.split('\n'), ...node.hidden ] : [ ...node.head.split('\n'), '[REMAINDER SHREDDED — run deep scan]' ];

        fileLines(node, name, p).forEach((ln, i) => {

      const names = Object.keys(node.children)
        .filter(n => !node.children[ n ].hid)
        .sort((a, b) => {
          const da = node.children[ a ].type === 'dir' ? 0 : 1, db = node.children[ b ].type === 'dir' ? 0 : 1;
          return da - db || a.localeCompare(b);
        });
      fmState.order = names.map(n => normPath(fmState.cwd, n));
      if (!names.length) { host.innerHTML = '<div class="fm-empty">EMPTY DIRECTORY</div>'; }
      names.forEach(name => {
        const child = node.children[ name ]; child._name = name;
        const p = normPath(fmState.cwd, name);
        const row = document.createElement('div');
        row.className = 'row' + (fmState.sel === p ? ' sel' : '') + (hasEv(p) ? ' pinned' : '');
        row.dataset.path = p;
        const sealed = child.type === 'locked' && !isUnlocked(p);
        row.innerHTML = `<span class="r-name">${ic(iconOf(child, name))}${esc(name)}${child.type === 'dir' ? '/' : ''}${hasEv(p) ? ic('pin', 'ic pinned-ic') : ''}</span>
      <span class="r-kind ${sealed ? 'sealed' : ''}">${kindOf(child)}</span>
      <span class="r-size">${nodeBytes(child) || '—'}</span>
      <span class="r-date">${child.type === 'dir' ? '—' : fdate(p)}</span>`;
        host.appendChild(row);
      });
      body.querySelector('[data-fm="foot"]').textContent = names.length + ' ITEM' + (names.length === 1 ? '' : 'S') + ' — ' + fmState.cwd;
    }
    function listClick(e) {
      const row = e.target.closest('.row'); if (!row) return;
      const p = row.dataset.path;
      if (fmState.sel === p) { fmState.sel = null; activate(p); return; }
      fmState.sel = p; renderList();
    }
    function listCtx(e) {
      const row = e.target.closest('.row'); if (!row) return;
      e.preventDefault();
      const p = row.dataset.path, node = resolve(p);
      const items = [ { l: 'OPEN', i: 'file', fn: () => { fmState.sel = p; renderList(); activate(p); } } ];
      if (node.ev && !hasEv(p)) items.push({ l: 'MARK AS EVIDENCE', i: 'pin', fn: () => { if (addEvidence(p)) toast('EVIDENCE PINNED', node.ev.title); } });
      items.push({ l: 'COPY PATH', i: 'file', fn: () => copyPath(p) });
      openCtx(e.clientX, e.clientY, items);
    }
    function activate(path) {
      const node = resolve(path); if (!node) return;
      if (node.type === 'dir') { fmNav(path); return; }
      openViewer(path, node);
    }

    /* =========================================================
       VIEWERS
       ========================================================= */
    function dimLines(html) {
      return html.split('\n').map(l => {
        const t = l.trim();
        if (/^(---|===|#|\[)/.test(t)) return `<span class="dimline">${l || ' '}</span>`;
        return l || ' ';
      }).join('\n');
    }
    function openViewer(path, node) {
      state.stats.opens = (state.stats.opens || 0) + 1; save();
      if (node.hid) check('ghost');
      const name = path.split('/').pop();
      const id = 'v:' + path;
      makeWin(id, { title: name, icon: iconOf(node, name), w: node.type === 'image' ? 660 : node.type === 'audio' ? 560 : 590, h: node.type === 'image' ? 560 : node.type === 'audio' ? 540 : 520 });
      const body = wm.wins.get(id).el.querySelector('.win-body');
      body.innerHTML = '';
      const wrap = document.createElement('div'); wrap.className = 'viewer';
      const tools = document.createElement('div'); tools.className = 'v-tools';
      tools.innerHTML = `<span class="v-path">${esc(path)}</span>`;
      const gated = node.type === 'audio' ? !isPlayed(path) : node.type === 'frag' ? !isRecovered(path) : false;
      if (node.type === 'image')
      {
        const bi = document.createElement('button'); bi.className = 'btn'; bi.innerHTML = ic('info') + ' FILE INFO';
        bi.onclick = () => { const p = wrap.querySelector('.imginfo'); p.classList.remove('uv'); p.innerHTML = infoHTML(); p.classList.toggle('show'); Snd.click(); };
        tools.appendChild(bi);
        if (node.info.hidden)
        {
          const uv = document.createElement('button'); uv.className = 'btn'; uv.innerHTML = ic('search') + ' EXAMINE';
          uv.onclick = () => {
            const p = wrap.querySelector('.imginfo');
            const on = !p.classList.contains('uv');
            p.classList.toggle('uv', on);
            p.innerHTML = on ? uvHTML() : infoHTML();
            p.classList.add('show');
            if (on) { check('uvlight'); addLog('Examined ' + path + ' under UV.'); }
            Snd.click();
          };
          tools.appendChild(uv);
        }
      }
      function infoHTML() {
        return `<div class="cap">${esc(node.info.caption)}</div>
      <div class="meta">${node.info.meta.map(m => '&gt; ' + esc(m)).join('<br>')}</div>`;
      }
      function uvHTML() {
        return `<div class="cap">FORENSIC EXAMINATION — UV / MAGNIFIED PASS</div>
      ${node.info.hidden.map(h => `<div class="uvl">&gt; ${esc(h)}</div>`).join('')}`;
      }
      if (node.ev)
      {
        if (hasEv(path))
        {
          tools.insertAdjacentHTML('beforeend', `<span class="ev-chip">${ic('check')} EXHIBIT ${evNum(path)} — ON THE BOARD</span>`);
        } else if (gated)
        {
          tools.insertAdjacentHTML('beforeend', `<span class="ev-wait">${node.type === 'audio' ? 'LISTEN TO THE END TO CITE' : 'RECOVER THE FILE TO CITE'}</span>`);
        } else
        {
          const b = document.createElement('button'); b.className = 'btn primary';
          b.innerHTML = ic('pin') + ' MARK AS EVIDENCE';
          b.onclick = () => { if (addEvidence(path)) { openViewer(path, node); toast('EVIDENCE PINNED — ' + evNum(path), node.ev.title); } };
          tools.appendChild(b);
        }
      }
      wrap.appendChild(tools);
      const scroll = document.createElement('div'); scroll.className = 'v-scroll';
      if (node.type === 'locked' && !isUnlocked(path))
      {
        scroll.innerHTML = `
      <div class="lockbox">
        ${ic('lock')}
        <h3>SEALED FILE</h3>
        <p>${esc(node.prompt)}</p>
        <input type="text" placeholder="enter password" spellcheck="false">
        <div class="lockerr"></div>
        <button class="btn primary" style="margin-top:6px">${ic('key')} UNSEAL</button>
      </div>`;
        const inp = scroll.querySelector('input'), err = scroll.querySelector('.lockerr');
        const attempt = () => {
          const v = norm(inp.value);
          if (node.accept.some(a => a === v || v === a.replace(/\s/g, '')))
          {
            setPush(state.unlocked, path); Snd.ev();
            toast('FILE UNSEALED', name + ' — content decrypted.');
            addLog('Unsealed ' + path);
            openViewer(path, node);
          } else
          {
            err.textContent = 'ACCESS DENIED — wrong key.';
            const lb = scroll.querySelector('.lockbox');
            lb.classList.remove('shake'); void lb.offsetWidth; lb.classList.add('shake');
            Snd.err();
          }
        };
        scroll.querySelector('button').onclick = attempt;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
      }
      else if (node.type === 'image')
      {
        const svgURI = 'data:image/svg+xml;utf8,' + encodeURIComponent(node.svg);
        scroll.innerHTML = `
      <div class="imgwrap"><img src="${svgURI}" alt="${esc(name)}"></div>
      <div class="imginfo">${infoHTML()}</div>`;
        scroll.querySelector('img').addEventListener('click', e => e.target.classList.toggle('zoomed'));
      }
      else if (node.type === 'audio')
      {
        scroll.innerHTML = `
      <div class="audio">
        <div class="a-head"><span class="a-title">${esc(node.title)}</span><span class="a-dur">RUNTIME ${esc(node.dur)} — ${isPlayed(path) ? 'PLAYED' : 'UNPLAYED'}</span></div>
        <div class="wave">${Array.from({ length: 40 }, (_, i) => `<span style="height:${20 + hashStr(path + ':' + i) % 70}%"></span>`).join('')}</div>
        <div class="a-trans">${node.lines.map(l => `<div class="a-line" data-sec="${l[ 0 ]}"><span class="a-t">${Math.floor(l[ 0 ] / 60)}:${pad2(Math.round(l[ 0 ] % 60))}</span><span>${esc(l[ 1 ])}</span></div>`).join('')}</div>
        <div class="a-ctrl">
          <button class="btn primary a-play">${ic('play')} PLAY</button>
          <button class="btn a-speed">1\u00d7</button>
          <div class="a-prog"><i></i></div>
          <span class="a-time">0:00 / ${esc(node.dur)}</span>
        </div>
      </div>`;
        const el = scroll.querySelector('.audio');
        const wave = el.querySelector('.wave'), trans = el.querySelector('.a-trans'),
          prog = el.querySelector('.a-prog i'), time = el.querySelector('.a-time'),
          playBtn = el.querySelector('.a-play'), speedBtn = el.querySelector('.a-speed');
        const total = parseInt(node.dur.split(':')[ 0 ]) * 60 + parseInt(node.dur.split(':')[ 1 ]);
        let elapsed = 0, speed = 1, timer = null;
        const lines = [ ...trans.querySelectorAll('.a-line') ];
        function paint() {
          prog.style.width = Math.min(100, elapsed / total * 100) + '%';
          time.textContent = Math.floor(elapsed / 60) + ':' + pad2(Math.floor(elapsed % 60)) + ' / ' + node.dur;
          lines.forEach(l => l.classList.toggle('on', elapsed >= +l.dataset.sec));
          const last = lines.filter(l => elapsed >= +l.dataset.sec).pop();
          if (last) last.scrollIntoView({ block: 'nearest' });
        }
        function stop() { clearInterval(timer); timer = null; wave.classList.remove('playing'); Snd.stopNoise(); playBtn.innerHTML = ic('play') + ' PLAY'; }
        playBtn.onclick = () => {
          if (timer) { stop(); return; }
          if (elapsed >= total) elapsed = 0;
          timer = setInterval(() => {
            elapsed = Math.min(total, elapsed + 0.1 * speed);
            paint();
            if (elapsed >= total)
            {
              stop();
              if (!isPlayed(path)) { setPush(state.played, path); check('ears'); addLog('Listened to ' + path); }
              setTimeout(() => openViewer(path, node), 350);
            }
          }, 100);
          wave.classList.add('playing');
          wave.querySelectorAll('span').forEach((s, i) => s.style.animationDelay = (i % 7) * 0.07 + 's');
          Snd.startNoise();
          playBtn.innerHTML = ic('pause') + ' PAUSE';
        };
        speedBtn.onclick = () => { speed = speed === 1 ? 3 : 1; speedBtn.textContent = speed + '\u00d7'; Snd.click(); };
        if (isPlayed(path)) { elapsed = total; paint(); }
        wm.wins.get(id).onclose = () => { if (timer) clearInterval(timer); Snd.stopNoise(); };
      }
      else if (node.type === 'frag')
      {
        const rec = isRecovered(path);
        const blocks = rec ? [] : node.hidden.map((_, i) => {
          const w = 18 + hashStr(path + ':' + i) % 22;
          return `<div class="blk">${'\u2588'.repeat(w)}</div>`;
        }).join('');
        scroll.innerHTML = `
      <div class="frag">
        <div class="fmeta"><span>DELETED FILE — CLUSTER FRAGMENTS</span><span>${rec ? 'RECOVERY: 100%' : 'RECOVERY: ' + Math.round(node.head.length / (node.head.length + node.hidden.join('').length) * 100) + '%'}</span></div>
        ${node.head.split('\n').map(l => `<div class="fline">${esc(l) || ' '}</div>`).join('')}
        ${rec
            ? node.hidden.map(l => `<div class="fline">${esc(l) || ' '}</div>`).join('')
            : blocks}
        ${rec ? '' : `<button class="btn primary scn" style="margin-top:16px">${ic('search')} DEEP SCAN RECOVERY</button>`}
      </div>`;
        if (!rec)
        {
          const btn = scroll.querySelector('.scn');
          btn.onclick = () => {
            btn.disabled = true; btn.innerHTML = ic('search') + ' SCANNING\u2026';
            const blks = [ ...scroll.querySelectorAll('.blk') ];
            let i = 0;
            const iv = setInterval(() => {
              if (i >= blks.length)
              {
                clearInterval(iv);
                setPush(state.recovered, path);
                check('deepscan'); addLog('Deep-scanned ' + path);
                toast('RECOVERY COMPLETE', name + ' — ' + node.hidden.length + ' clusters reassembled.');
                setTimeout(() => openViewer(path, node), 300);
                return;
              }
              blks[ i ].outerHTML = `<div class="fline">${esc(node.hidden[ i ]) || ' '}</div>`;
              Snd.tick(); i++;
            }, 240);
          };
        }
      }
      else if (node.type === 'email')
      {
        scroll.innerHTML = `
      <div class="mailhead">
        <div class="mh-row"><span class="mh-k">FROM</span><span class="mh-v">${esc(node.from)}</span></div>
        <div class="mh-row"><span class="mh-k">TO</span><span class="mh-v">${esc(node.to)}</span></div>
        <div class="mh-row"><span class="mh-k">DATE</span><span class="mh-v">${esc(node.date)}</span></div>
        <div class="mh-row"><span class="mh-k">SUBJ</span><span class="mh-v subj">${esc(node.subject)}</span></div>
      </div>
      <div class="mailbody">${esc(node.body)}</div>`;
      }
      else if (node.type === 'chat')
      {
        scroll.innerHTML = '<div class="chatlog">' + node.entries.map(e => {
          const cls = hashStr(e[ 1 ]) % 2 ? 'w-b' : 'w-a';
          return `<div class="chat-line"><span class="chat-t">${esc(e[ 0 ])}</span><span class="chat-who ${cls}">${esc(e[ 1 ])}</span><span class="chat-msg">${esc(e[ 2 ])}</span></div>`;
        }).join('') + '</div>';
      }
      else if (name.endsWith('.csv'))
      {
        const rows = node.content.trim().split('\n').map(r => r.split(','));
        scroll.innerHTML = `<div class="csvwrap"><table>${rows.map((r, i) => `<tr>${r.map(c => `<${i ? 'td' : 'th'}>${esc(c.trim())}</${i ? 'td' : 'th'}>`).join('')}</tr>`).join('')}</table></div>`;
      }
      else
      {
        const cls = node.style === 'mono' ? 'mono' : 'paper';
        scroll.innerHTML = `<div class="doc ${cls}">${node.style === 'mono' ? dimLines(esc(node.content)) : esc(node.content)}</div>`;
      }
      wrap.appendChild(scroll);
      body.appendChild(wrap);
    }

    /* =========================================================
       EVIDENCE DRAWER
       ========================================================= */
    function refreshEvUI() {
      const n = evList().length;
      $('#evbtn .cnt').textContent = n;
      $('#evbtn').classList.toggle('zero', n === 0);
      const c = $('#cf-evcount'); if (c) c.textContent = n + ' item' + (n === 1 ? '' : 's') + ' pinned';
      renderDrawer();
    }
    function renderDrawer() {
      $('#dr-title').textContent = 'EVIDENCE BOARD — CASE №' + CASE().no + ' ' + CASE().title;
      const b = $('#dr-body'); b.innerHTML = '';
      const list = evList();
      $('#dr-count').textContent = list.length ? list.length + ' pinned \u00b7 ' + countEv(CASE()) + ' on disk' : '';
      if (!list.length) { b.innerHTML = '<div class="ev-empty">Nothing pinned. Open a document in DISK MANAGER and mark it as evidence.</div>'; return; }
      list.forEach((path, i) => {
        const node = resolve(path); if (!node || !node.ev) return;
        const card = document.createElement('div'); card.className = 'evcard';
        card.innerHTML = `${ic('pin', 'ic pin')}<span class="nx" title="Remove from board">\u00d7</span><span class="evno">EXHIBIT E-${pad2(i + 1)}</span><h4>${esc(node.ev.title)}</h4><p>${esc(node.ev.note)}</p><div class="src">${esc(path)}</div>`;
        card.querySelector('.nx').onclick = e => { e.stopPropagation(); removeEvidence(path); openIfShown(path); };
        card.onclick = () => { openViewer(path, node); };
        b.appendChild(card);
      });
    }
    function openIfShown(path) { if (wm.wins.has('v:' + path)) openViewer(path, resolve(path)); }
    $('#evbtn').onclick = () => { $('#drawer').classList.toggle('open'); Snd.click(); };
    $('#dr-close').onclick = () => $('#drawer').classList.remove('open');

    /* =========================================================
       CROSS-REFERENCE ENGINE
       ========================================================= */
    function checkLinks() {
      const c = CASE(); const list = evList(); const L = c.links || [];
      L.forEach((lk, i) => {
        if ((state.links[ c.id ] || []).includes(i)) return;
        if (list.includes(lk.a) && list.includes(lk.b))
        {
          (state.links[ c.id ] || (state.links[ c.id ] = [])).push(i); save();
          Snd.ev(); toast('CROSS-REFERENCE VERIFIED', lk.t);
          addLog('Link verified: ' + lk.t);
          const tot = CASES.reduce((a, cc) => a + ((state.links[ cc.id ] || []).length), 0);
          if (tot >= 5) check('redstring');
          if (wm.wins.has('casefile')) openCaseFile();
        }
      });
    }

    /* =========================================================
       INTERROGATION ROOM (+ bluffing: cheap talk vs. proof)
       ========================================================= */
    let interSel = 0;
    function stanceOf(i) {
      const c = CASE(), s = c.suspects[ i ];
      const st = (state.inter[ c.id ] || {})[ 's' + i ];
      if (s.absent) return { k: 'ease', t: 'ABSENT' };
      if (!st || (!(st.hits && st.hits.length) && !st.done)) return { k: 'ease', t: 'AT EASE' };
      if (st.done === 'cracked') return { k: 'crack', t: 'CRACKED — SIGNED' };
      if (st.done === 'cleared') return { k: 'clear', t: 'CLEARED — ON FILE' };
      return { k: 'press', t: 'PRESSURED ' + st.hits.length + '/' + s.points.length };
    }
    function injectStatements() {
      const c = CASE(), tree = c.tree;
      if (!tree.children.Statements) tree.children.Statements = D({});
      const dir = tree.children.Statements;
      const fname = s => s.name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_statement.txt';
      c.suspects.forEach(s => { const f = fname(s); if (dir.children[ f ] && dir.children[ f ]._gen) delete dir.children[ f ]; });
      const inter = state.inter[ c.id ] || {};
      c.suspects.forEach((s, i) => {
        const st = inter[ 's' + i ]; if (!st || !st.done) return;
        const txt = st.done === 'cracked' ? s.crack : s.clear;
        const node = T(txt, {
          style: 'mono', ev: {
            title: 'STATEMENT — ' + s.name,
            note: st.done === 'cracked' ? 'Secured under pressure in the interrogation room.' : 'Voluntary clearance statement — on file.'
          }
        });
        node._gen = true;
        dir.children[ fname(s) ] = node;
      });
      const pst = state.plea[ c.id ];
      if (pst && pst.r.includes('flip') && !dir.children[ 'cooperation_memo.txt' ])
      {
        const node = T(c.plea.memo, { style: 'mono', ev: { title: 'Cooperation memo', note: 'Testimony secured at the plea desk — the DA\u2019s copy. Pin it.' } });
        node._plea = true;
        dir.children[ 'cooperation_memo.txt' ] = node;
      }
    }
    function sayLine(i, w, t, cls) {
      const c = CASE();
      const tt = state.trans[ c.id ] || (state.trans[ c.id ] = {});
      const arr = tt[ 's' + i ] || (tt[ 's' + i ] = []);
      arr.push({ w, t, c: cls || '' });
      if (arr.length > 70) arr.shift();
      save();
      if (wm.wins.has('interro') && interSel === i) renderTrans();
    }
    function renderTrans() {
      const tr = $('#inr-trans'); if (!tr) return;
      const c = CASE();
      const arr = ((state.trans[ c.id ] || {})[ 's' + interSel ]) || [];
      tr.innerHTML = arr.length ? arr.map(l => {
        const who = l.w === 'det' ? 'YOU, DETECTIVE' : (l.w === 'sys' ? '\u2014' : c.suspects[ interSel ].name.toUpperCase() + (l.c === 'crk' ? ' — SIGNED STATEMENT' : ''));
        return `<div class="dlg ${l.w} ${l.c || ''}"><div class="who">${esc(who)}</div><div class="txt">${esc(l.t)}</div></div>`;
      }).join('')
        : `<div class="inr-empty">THE ROOM IS QUIET.<br><br>PIN PAPER. THEN PRESENT IT.<br><br>INNOCENT PEOPLE GET NERVOUS TOO —<br>BUT ONLY GUILT CHANGES ITS STORY.</div>`;
      tr.scrollTop = tr.scrollHeight;
    }
    function renderTray() {
      const tray = $('#inr-tray'); if (!tray) return;
      const c = CASE();
      const st = (state.inter[ c.id ] || {})[ 's' + interSel ] || {};
      const list = evList();
      const bluffLbl = st.bluffed === 'called' ? 'CALLED — THEY\u2019RE NOT BUYING IT'
        : st.bluffed === 'used' ? 'BLUFF ALREADY SPENT'
          : 'BLUFF — \u201cTHERE\u2019S MORE WHERE THAT CAME FROM\u201d';
      tray.innerHTML = `<div class="lbl">PRESENT AN EXHIBIT — ${list.length} PINNED</div>` +
        (list.length ? `<div class="evchip-row">${list.map((p, pi) => {
          const n = resolve(p); const t = (n && n.ev) ? n.ev.title : p.split('/').pop();
          return `<button class="evbtn" data-p="${esc(p)}">E-${pad2(pi + 1)} \u00b7 ${esc(t)}</button>`;
        }).join('')}</div>`
          : `<div class="cf-note">Nothing pinned. Words don\u2019t scare anyone — paper does.</div>`) +
        `<div class="pd-row" style="margin:10px 0 0">
      <button class="btn ${st.bluffed ? '' : 'primary'}" id="inr-bluff" ${st.bluffed ? 'disabled' : ''}>${ic('chat')} ${esc(bluffLbl)}</button>
      <span class="cf-note">bluffs are cheap talk: land one only if the meter is already half up</span></div>`;
      tray.querySelectorAll('.evbtn').forEach(b => b.onclick = () => presentInInterro(b.dataset.p));
      const bb = tray.querySelector('#inr-bluff'); if (bb) bb.onclick = presentBluff;
    }
    function presentInInterro(path) {
      const c = CASE(); const i = interSel; const s = c.suspects[ i ];
      const inter = state.inter[ c.id ] || (state.inter[ c.id ] = {});
      const st = inter[ 's' + i ] || (inter[ 's' + i ] = { hits: [], done: null });
      const node = resolve(path);
      const title = (node && node.ev) ? node.ev.title : path.split('/').pop();
      if (s.absent)
      {
        sayLine(i, 'det', 'I slide "' + title + '" across the table, out of habit.');
        sayLine(i, 'sys', s.denials[ 0 ]); Snd.err(); return;
      }
      if (st.done)
      {
        sayLine(i, 'det', 'Once more, for the file: "' + title + '".');
        sayLine(i, 'sus', st.done === 'cracked' ? 'I gave you everything. It\u2019s in writing now. Go read it.' : 'We\u2019re done here. My statement\u2019s on file.');
        return;
      }
      const hit = s.points.findIndex(p => p.ev === path);
      if (hit >= 0)
      {
        if (st.hits.includes(hit))
        {
          sayLine(i, 'det', 'Back to "' + title + '".');
          sayLine(i, 'sus', 'Already answered. Same answer. Louder.');
          return;
        }
        st.hits.push(hit); save();
        sayLine(i, 'det', s.points[ hit ].q);
        sayLine(i, 'sus', s.points[ hit ].a);
        Snd.ev();
        if (st.hits.length === s.points.length)
        {
          st.done = s.crack ? 'cracked' : 'cleared'; save();
          sayLine(i, 'sus', s.crack || s.clear, 'crk');
          sayLine(i, 'sys', (s.crack ? 'STATEMENT SECURED' : 'STATEMENT TAKEN') + ' — filed to /Statements/ on the mounted drive.');
          injectStatements();
          if (wm.wins.has('fm')) renderFM();
          addLog((s.crack ? 'Confession — ' : 'Cleared — ') + s.name);
          toast(s.crack ? 'CONFESSION SECURED' : 'SUSPECT CLEARED', s.name + ' — new file at /Statements/.');

    function presentBluff() {

    let pleaSel = 0;
    function pleaSt(cid) {
      if (!state.plea[ cid ]) state.plea[ cid ] = { g: [ { believe: .22, heat: .38, used: [] }, { believe: .22, heat: .38, used: [] } ], r: [ null, null ], att: 0, last: null };
      return state.plea[ cid ];
    }
    function pleaThr(p) { return .45 + .3 * p.loyal; }
    function loyalWord(l) { return l >= .65 ? 'SOLID' : l >= .45 ? 'SPLIT' : 'OPPORTUNIST'; }
    function pleaStance(i) {
      const c = CASE(), st = pleaSt(c.id), p = c.plea[ i ? 'p2' : 'p1' ], g = st.g[ i ];
      if (st.r[ i ] === 'flip') return { t: 'SIGNED — COOPERATING', k: 'crack' };
      if (g.heat >= .85) return { t: 'CORNERED — TAKES ANY DEAL', k: 'crack' };
      const thr = pleaThr(p);
      if (g.believe >= thr) return { t: 'READY TO FLIP', k: 'crack' };
      if (g.believe >= thr - .15) return { t: 'WAVERING', k: 'press' };
      return { t: 'HOLDING FIRM', k: 'ease' };
    }

    function showToPlea(path) {
      const c = CASE(), pl = [ c.plea.p1, c.plea.p2 ], st = pleaSt(c.id);
      const i = pleaSel, p = pl[ i ], g = st.g[ i ];
      if (st.r[ i ] === 'flip' || g.used.includes(path)) return;
      const node = resolve(path);
      const title = (node && node.ev) ? node.ev.title : path.split('/').pop();
      g.used.push(path);
      let msg;
      if ((p.fearEvs || []).includes(path))
      {
        g.believe = Math.min(.95, g.believe + .2);
        msg = p.onFear; Snd.ev();
      } else if ((p.heatEvs || []).includes(path))
      {
        g.heat = Math.min(.95, g.heat + .22);
        msg = p.onHeat; Snd.ev();
      } else
      {
        g.believe = Math.min(.95, g.believe + .09);
        g.heat = Math.min(.95, g.heat + .05);
        msg = 'They read it twice and say nothing. The silence is the tell.'; Snd.click();
      }
      addLog('Plea desk: showed \u201c' + title + '\u201d to ' + p.name);
      save(); renderPlea();
      toast('PLEA DESK — ' + p.name.split(' ')[ 0 ], msg);

    function offerPlea() {
      const c = CASE(), pl = [ c.plea.p1, c.plea.p2 ], st = pleaSt(c.id);
      st.att++;
      const lines = [], fresh = [];
      for (let i = 0; i < 2; i++)
      {
        if (st.r[ i ] === 'flip') continue;
        const other = 1 - i;
        if (st.r[ other ] === 'flip')
        {
          st.r[ i ] = 'flip'; fresh.push({ i, flip: true, cascade: true });
          continue;
        }
        const p = pl[ i ], g = st.g[ i ];
        const flip = g.heat >= .85 || g.believe >= pleaThr(p);
        const isNew = st.r[ i ] === null;
        st.r[ i ] = flip ? 'flip' : 'hold';
        if (isNew || flip) fresh.push({ i, flip, cascade: false });
      }
      if (!fresh.length) lines.push('Same answers, both rooms. The DA shrugs and refills the water.');
      fresh.forEach(f => {
        const p = pl[ f.i ];
        if (f.cascade)
        {
          lines.push(p.name + ': \u201cThey SIGNED?! ...Fine. Fine. I\u2019m not riding this down alone.\u201d');
        } else if (f.flip)
        {
          lines.push(p.name + ': ' + (p.loyal >= .6 ? '\u201c...tell my kid I held as long as I could.\u201d The pen shakes, but it signs.' : '\u201cWhere do I sign?\u201d The chair is barely warm before they lean in.'));
        } else
        {
          lines.push(p.name + ': ' + (p.loyal >= .6 ? '\u201cWe had a code. I\u2019m keeping mine.\u201d' : '\u201cCall my lawyer. We\u2019re done talking.\u201d'));
        }
      });
      const any = st.r.includes('flip');
      const both = st.r.every(x => x === 'flip');
      const cell = both ? 'cc' : (st.r[ 0 ] === 'flip' ? 'ch' : (st.r[ 1 ] === 'flip' ? 'hc' : 'hh'));
      let foot;
      if (both)
      {
        foot = [ 'Both signed within the minute. The DA pours two coffees and calls it a good morning.',
          'Cooperation memo filed to /Statements/ — pin it, it counts.' ];
        check('mechdesign');
        addLog('Plea desk: BOTH parties flipped.');

      } else
      {
        foot = [ 'Nobody moved. Two chairs, two silences, one very quiet office.',
          'The DA suggests pricing their faith harder: more heat, more fear — then re-extend the deal.' ];
        check('pareto');
        addLog('Plea desk: both held the line. Pareto, apparently.', 'bad');
        toast('THEY HELD', 'Neither took the deal. The DA was not amused. (The agency filed it under \u201cPareto.\u201d)', true);
      }
      st.last = { cell, lines, foot };
      save();
      injectStatements();
      if (wm.wins.has('fm')) renderFM();
      refreshEvUI();
      renderPlea();
    }
