    /* =========================================================
       ACCUSATION MODAL + SCORING
       ========================================================= */
    const REJECTIONS = [
      'The DA glanced at your folder for four seconds and handed it back.',
      'Your client asked for a refund. In writing.',
      'The suspect\u2019s lawyer is now drafting a defamation suit. Re-check the board.',
      'Close. Wrong. The kind of wrong that gets offices shot at.',
      'The agency is removing your name from the letterhead. Prove it better.'
    ];
    function closeModal() { const r = $('#modal-root'); r.classList.remove('show'); r.innerHTML = ''; }
    function openAccusation() {
      const c = CASE();
      const inter = state.inter[ c.id ] || {};
      const cracked = c.suspects.filter((s, i) => inter[ 's' + i ] && inter[ 's' + i ].done === 'cracked').length;
      const linksN = (state.links[ c.id ] || []).length;
      const root = $('#modal-root');
      root.innerHTML = `<div class="modal">
    <div class="m-head">${ic('case')}<span class="t-title">FORM 7 — FORMAL ACCUSATION — CASE №${c.no}</span>
      <span class="cf-note" style="margin-left:auto">EXHIBITS: ${evList().length} (MIN 3)</span>
      <button class="ibtn" style="margin-left:8px" id="m-x">${ic('x')}</button></div>
    <div class="m-body">
      <div class="cf-note" style="margin-bottom:14px;letter-spacing:.08em">statements signed: ${cracked} \u00b7 cross-references verified: ${linksN}/${(c.links || []).length}</div>
      ${c.questions.map((q, i) => `
        <div class="qq" data-qi="${i}">
          <div class="q-label">${esc(q.q)}</div>
          ${q.type === 'choice'
          ? q.options.map((o, oi) => `<label class="opt"><input type="radio" name="q${i}" value="${oi}"><span class="box"></span>${esc(o)}</label>`).join('')
          : `<input type="text" name="q${i}" placeholder="${esc(q.placeholder || 'type your answer')}" spellcheck="false">`}
          <div class="qres" data-res="${i}"></div>
        </div>`).join('')}
      <div class="qres" id="q-flavor"></div>
    </div>
    <div class="m-foot">
      <button class="btn" id="m-cancel">WITHDRAW</button>
      <button class="btn primary" id="m-submit">${ic('check')} SUBMIT TO THE DA</button>
    </div>
  </div>`;
      root.classList.add('show');
      root.querySelectorAll('.opt').forEach(o => {
        o.addEventListener('click', () => {
          const qq = o.closest('.qq');
          qq.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
          o.classList.add('on'); o.querySelector('input').checked = true; Snd.click();
        });
      });
      root.querySelector('#m-x').onclick = closeModal;
      root.querySelector('#m-cancel').onclick = () => { closeModal(); Snd.close(); };
      root.querySelector('#m-submit').onclick = () => {
        const c = CASE();
        if (evList().length < 3)
        {
          Snd.err();
          toast('INSUFFICIENT EXHIBITS', 'The DA needs at least 3 pinned exhibits. You have ' + evList().length + '.', true);
          return;
        }
        const results = c.questions.map((q, i) => {
          const box = root.querySelector(`[data-qi="${i}"]`);
          let given = '', good = false;
          if (q.type === 'choice')
          {
            const r = box.querySelector('input:checked');
            given = r ? q.options[ +r.value ] : null; good = r !== null && +r.value === q.answer;
          } else
          {
            given = box.querySelector('input').value;
            const v = norm(given);
            good = q.accept.some(a => a === v || v === a.replace(/\s/g, ''));
          }
          const res = box.querySelector('[data-res]');
          res.classList.add('show');
          res.innerHTML = `<div class="qr-line ${good ? 'ok' : 'bad'}">${good ? 'HOLDS UP:' : 'DOES NOT HOLD UP:'} ${esc(given || '\u2014 no answer \u2014')}</div>`;
          return good;
        });
        if (results.every(Boolean))
        {
          closeModal();
          const r = solveCase();
          Snd.stamp(); setTimeout(() => Snd.stamp(), 160);
          showScorecard(r);
        } else
        {
          state.rej[ c.id ] = (state.rej[ c.id ] || 0) + 1; save(); Snd.err();
          addLog('Form 7 rejected (attempt ' + state.rej[ c.id ] + ')', 'bad');
          const f = root.querySelector('#q-flavor'); f.classList.add('show');
          f.innerHTML = `<div class="flavor">${esc(REJECTIONS[ Math.min(state.rej[ c.id ] - 1, REJECTIONS.length - 1) ])}</div>
        <div class="qr-line" style="margin-top:8px;color:var(--dim)">Fix the flagged answers and submit again.</div>`;
        }
      };
    }
    function solveCase() {
      const c = CASE();
      state.solved.add(c.id); state.done.add(c.id);
      const hints = state.hints[ c.id ] || 0, rej = state.rej[ c.id ] || 0;
      const total = countEv(c), ex = evList().length;
      const cov = total ? ex / total : 0;
      const t0 = state.t0[ c.id ] || Date.now();
      const time = Date.now() - t0;
      const under = time < c.par * 1000;
      if (under) check('underpar');
      if (c.id === 'c6') check('alias');
      const inter = state.inter[ c.id ] || {};
      const conf = !!(inter[ 's' + c.culprit ] && inter[ 's' + c.culprit ].done === 'cracked');
      const avail = c.suspects.filter(x => !x.absent).length;
      const res = c.suspects.filter((x, i) => !x.absent && inter[ 's' + i ] && inter[ 's' + i ].done).length;
      const links = (state.links[ c.id ] || []).length, linksT = (c.links || []).length;
      const pst = state.plea[ c.id ];
      const pleaOut = pst ? (pst.r.every(x => x === 'flip') ? 'both' : (pst.r.includes('flip') ? 'one' : 'none')) : null;
      const pleaBonus = pleaOut === 'both' ? 6 : pleaOut === 'one' ? 3 : 0;
      const score = Math.max(0, Math.min(100, Math.round(100 - rej * 12 - hints * 8 + cov * 10 + (conf ? 6 : 0) + ((avail && res === avail) ? 4 : 0) + pleaBonus)));
      const rank = score >= 90 ? 'MASTER SLEUTH' : score >= 75 ? 'INSPECTOR, FIRST GRADE' : score >= 60 ? 'GUMSHOE' : 'ROOKIE, PROVISIONAL';
      state.score[ c.id ] = { score, rank, time, hints, rej, ex, total, conf, res, avail, links, linksT, under, par: c.par, plea: pleaOut };
      save();
      $('#shelfCount').textContent = state.done.size + '/' + CASES.length;
      check('closer');
      if (hints === 0 && rej === 0) check('bythebook');
      if (state.done.size === CASES.length) check('complete');
      addLog('Case \u2116' + c.no + ' CLOSED — ' + rank + ' (' + score + '/100' + (under ? ', under par' : '') + (pleaBonus ? ', +plea' : '') + ')');
      return { score, rank, time, hints, rej, ex, total, conf, res, avail, links, linksT, under, par: c.par, plea: pleaOut };
    }
    const RANKFLAV = {
      'MASTER SLEUTH': 'The DA reads your file twice and doesn\u2019t change a word. Salter frames the cover sheet.',
      'INSPECTOR, FIRST GRADE': 'Airtight where it counts. Page initials it without a comment — which is high praise.',
      'GUMSHOE': 'It holds. A little duct tape in the middle, but it holds.',
      'ROOKIE, PROVISIONAL': 'It holds. Barely. The agency is billing you for the aspirin.'
    };
    function showScorecard(r) {
      const root = $('#modal-root');
      root.innerHTML = `<div class="modal" style="width:min(500px,94vw)">
    <div class="m-head">${ic('star')}<span class="t-title">CASE PERFORMANCE REVIEW</span></div>
    <div class="m-body">
      <div class="cf-note" style="letter-spacing:.2em;font-size:10px">THE AGENCY RANKS YOU</div>
      <div class="rank">${esc(r.rank)}</div>
      <div class="rankgrid">
        <div class="rg"><b>SCORE</b><span>${r.score}/100</span></div>
        <div class="rg"><b>TIME ON DISK</b><span>${fmtDur(r.time)}${r.under ? ' \u2713' : ' / PAR ' + fmtDur(r.par * 1000)}</span></div>
        <div class="rg"><b>EXHIBITS</b><span>${r.ex} / ${r.total}</span></div>
        <div class="rg"><b>HINTS / REJECTIONS</b><span>${r.hints} / ${r.rej}</span></div>
        <div class="rg"><b>CONFESSION</b><span>${r.conf ? 'SECURED' : '\u2014'}</span></div>
        <div class="rg"><b>SUSPECTS \u00b7 LINKS</b><span>${r.res}/${r.avail} \u00b7 ${r.links}/${r.linksT}</span></div>
        <div class="rg"><b>PLEA DESK</b><span>${r.plea === 'both' ? 'BOTH FLIPPED' : r.plea === 'one' ? 'ONE FLIPPED' : r.plea === 'none' ? 'HELD FIRM' : '\u2014'}</span></div>
      </div>
      <div class="rankflav">${esc(RANKFLAV[ r.rank ])}</div>
    </div>
    <div class="m-foot">
      ${state.done.size === CASES.length ? `<button class="btn" id="s-doss">${ic('book')} THE DOSSIER</button>` : ''}
      <button class="btn primary" id="s-file">${ic('case')} VIEW CASE FILE</button>
    </div>
  </div>`;
      root.classList.add('show');
      root.querySelector('#s-file').onclick = () => { closeModal(); refreshEvUI(); openCaseFile(true); };
      const d = root.querySelector('#s-doss');
      if (d) d.onclick = () => { closeModal(); refreshEvUI(); openDossier(); };
    }

    function reopenCase() {
      const c = CASE(); const id = c.id;
      delete state.ev[ id ]; delete state.hints[ id ]; delete state.rej[ id ];
      delete state.score[ id ]; delete state.inter[ id ]; delete state.links[ id ];
      delete state.trans[ id ]; delete state.plea[ id ];
      state.solved.delete(id); state.t0[ id ] = Date.now();
      if (c.tree.children.Statements) delete c.tree.children.Statements.children[ 'cooperation_memo.txt' ];
      save(); refreshEvUI();
      $('#shelfCount').textContent = state.done.size + '/' + CASES.length;
      toast('CASE REOPENED', 'Board cleared for another pass. Passwords and recovered files stay learned — the clock does not.');
      mountCase(id);
    }

    /* =========================================================
       DOSSIER
       ========================================================= */
    function openDossier() {
      const root = $('#modal-root');
      const done = state.done.size;
      const scores = Object.values(state.score);
      const avg = scores.length ? Math.round(scores.reduce((a, s) => a + s.score, 0) / scores.length) : 0;
      const totalEv = CASES.reduce((a, c) => a + countEv(c), 0);
      const pinnedEv = CASES.reduce((a, c) => a + ((state.ev[ c.id ] || []).length), 0);
      root.innerHTML = `<div class="modal" style="width:min(620px,94vw)">
    <div class="m-head">${ic('book')}<span class="t-title">THE DOSSIER — SALTER &amp; PAGE</span>
      <button class="ibtn" style="margin-left:auto" id="d-x">${ic('x')}</button></div>
    <div class="m-body">
      <div class="rankgrid" style="margin:0 0 16px">
        <div class="rg"><b>CASES CLOSED</b><span>${done} / ${CASES.length}</span></div>
        <div class="rg"><b>AVERAGE SCORE</b><span>${scores.length ? avg + '\u2009/\u2009100' : '—'}</span></div>
        <div class="rg"><b>EXHIBITS PINNED</b><span>${pinnedEv} / ${totalEv}</span></div>
        <div class="rg"><b>COMMENDATIONS</b><span>${state.ach.length} / ${Object.keys(ACH).length}</span></div>
        <div class="rg"><b>FILES EXAMINED</b><span>${state.stats.opens || 0}</span></div>
        <div class="rg"><b>SHELL COMMANDS</b><span>${state.stats.cmds || 0}</span></div>
      </div>
      <div class="cf-label" style="margin-top:6px">CASE SHELF</div>
      ${CASES.map((c, i) => {
        const sc = state.score[ c.id ];
        const d = state.done.has(c.id), sv = state.solved.has(c.id);
        const locked = i > 0 && !state.done.has(CASES[ i - 1 ].id);
        const cls = locked ? 'seal' : (sv ? 'done' : 'open');
        const lbl = locked ? 'SEALED' : (sv ? (sc ? sc.rank : 'CLOSED') : (d ? 'REOPEN' : 'OPEN'));
        const pleaG = !locked && state.plea[ c.id ] && state.plea[ c.id ].r.includes('flip') ? ' \u00b7 PLEA\u2713' : '';
        return `<div class="doss-case"><span class="dno">\u2116${c.no}</span><b>${esc(c.title)}</b>
          <span class="dst ${cls}">${esc(lbl)}${sv && sc ? ' — ' + sc.score + '/100' : ''}${sv && sc && sc.under ? ' \u2713' : ''}${pleaG}</span></div>`;
      }).join('')}
      <div class="cf-label">COMMENDATIONS</div>
      <div class="achgrid">
        ${Object.entries(ACH).map(([ id, a ]) => `<span class="ach ${state.ach.includes(id) ? 'got' : ''}" title="${esc(a.d)}">${ic('star', 'ic')} ${esc(a.n)}</span>`).join('')}
      </div>
    </div>
    <div class="m-foot">
      <button class="btn danger" id="d-reset">${ic('trash')} RESET</button>
      <button class="btn primary" id="d-ok">CLOSE</button>
    </div>
  </div>`;
      root.classList.add('show');
      root.querySelector('#d-x').onclick = closeModal;
      root.querySelector('#d-ok').onclick = closeModal;
      root.querySelector('#d-reset').onclick = confirmReset;
    }

    /* =========================================================

       ========================================================= */
    function openSearch() {
      makeWin('search', { title: 'DEEP INDEX — ' + CASE().disk, icon: 'search', w: 620, h: 480 });
      const body = wm.wins.get('search').el.querySelector('.win-body');
      body.innerHTML = `<div class="search">
    <div class="s-bar">
      <input spellcheck="false" placeholder="search every file on the image\u2026 (names, bodies, logs)">
      <button class="btn primary s-go">${ic('search')} SEARCH</button>
    </div>
    <div class="s-info" id="s-info">INDEXED: FULL IMAGE — READ ONLY</div>
    <div class="s-res" id="s-res"><div class="s-empty">TYPE A NAME, A COMPANY, A BADGE NUMBER —<br>ANYTHING THAT MADE YOU LOOK TWICE.</div></div>
  </div>`;
      const inp = body.querySelector('input'), res = body.querySelector('#s-res'), info = body.querySelector('#s-info');
      function run(quiet) {
        const term = inp.value.trim();
        if (!term) { res.innerHTML = '<div class="s-empty">TYPE SOMETHING. THE DISK WON\u2019T TALK FIRST.</div>'; return; }
        const hits = searchDisk(term);
        if (!quiet) Snd.click();
        const sealed = hits.filter(h => h.sealed).length;
        info.textContent = 'QUERY: "' + term.toUpperCase() + '" — ' + hits.length + ' MATCH' + (hits.length === 1 ? '' : 'ES') + (sealed ? ' \u00b7 ' + sealed + ' SEALED' : '') + ' ACROSS THE IMAGE';
        if (!hits.length)
        {
          res.innerHTML = '<div class="s-empty">NO MATCHES. EITHER IT ISN\u2019T ON THE DISK —<br>OR IT\u2019S STILL SHREDDED. TRY THE TRASH.<br><br>NOTE: DOTFILES ARE OUTSIDE THIS INDEX —<br>SOME THINGS ONLY THE SHELL SEES.</div>';
          return;
        }
        res.innerHTML = hits.map((h, i) => {
          let snip = '';
          if (h.sealed) snip = '<div class="s-snip s-sealed">[SEALED — contents encrypted. find the key.]</div>';
          else if (h.snip !== null)
          {
            const raw = term;
            const idx = h.snip.toLowerCase().indexOf(raw.toLowerCase());
            let html;
            if (idx >= 0)
            {
              html = esc(h.snip.slice(0, idx)) + '<mark>' + esc(h.snip.slice(idx, idx + raw.length)) + '</mark>' + esc(h.snip.slice(idx + raw.length));
            } else html = esc(h.snip);
            snip = '<div class="s-snip">L' + h.line + '\u2003' + html + '</div>';
          }
          return `<div class="s-item" data-i="${i}"><div class="s-path">${ic(h.sealed ? 'lock' : 'file')} ${esc(h.p)}${hasEv(h.p) ? ic('pin', 'ic pinned-ic') : ''}</div>${snip}</div>`;
        }).join('');
        res.querySelectorAll('.s-item').forEach(el => {
          el.onclick = () => { const h = hits[ +el.dataset.i ]; openViewer(h.p, resolve(h.p)); };
        });
      }
      body.querySelector('.s-go').onclick = () => run(false);
      let sdeb = null;
      inp.addEventListener('input', () => { clearTimeout(sdeb); sdeb = setTimeout(() => run(true), 260); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(sdeb); run(false); } });
      setTimeout(() => inp.focus(), 50);
    }

    /* =========================================================
       TERMINAL
       ========================================================= */
    function openTerminal() {
      makeWin('term', { title: 'FIELD SHELL', icon: 'term', w: 660, h: 430 });
      const body = wm.wins.get('term').el.querySelector('.win-body');
      body.innerHTML = `<div class="term">
    <div class="term-out"></div>
    <div class="term-in"><span class="ps1"></span><input spellcheck="false" autocomplete="off"></div>
  </div>`;
      const out = body.querySelector('.term-out'), inp = body.querySelector('input'), ps1 = body.querySelector('.ps1');
      const T = { cwd: '/', hist: [], hi: 0 };
      const prompt = () => { ps1.textContent = 'det@' + CASE().disk + ':' + T.cwd + '$'; };
      const print = (txt, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = txt; out.appendChild(d); out.scrollTop = out.scrollHeight; };
      const prints = (html) => { const d = document.createElement('div'); d.innerHTML = html; out.appendChild(d); out.scrollTop = out.scrollHeight; };
      body.querySelector('.term').addEventListener('click', () => inp.focus());
      print("MONOLITH FIELD SHELL — evidence drive mounted (read only)");
      print("type 'help' for commands. TAB completes paths. 'ls -a' sees more than the manager does.", 'tdim');
      prompt();
      const HELP =
        `help              this list
ls [-a] [path]    list directory (-a includes dotfiles)
cd <path>         change directory
cat <file>        print file (sealed files stay sealed)
open <path>       open file in a viewer window
grep <term>       search the whole image, dotfiles included
pin <path>        mark a file as evidence
pwd               where am I
hint              request agency guidance
case              current case status
ev                list pinned exhibits
suspects          interrogation status, per suspect
statements        list signed statements on the drive
plea              open the plea desk (needs 3 exhibits)
links             verified cross-references
timeline          open the case timeline
history           recent commands
log               recent field log entries
note <text>       add a desk note
start <app>       case|disk|search|interro|plea|timeline|log|notes|about|settings
rank              the agency's opinion of you, so far
theme <t>         phosphor: amber | green
trash             jump to the recycle bin
clear             clear screen
reset confirm     wipe the entire investigation`;
      const run = line => {
        const parts = line.trim().split(/\s+/); const cmd = (parts.shift() || '').toLowerCase();
        const arg = parts.join(' ');
        if (line.trim()) { state.stats.cmds++; if (state.stats.cmds === 10) check('shell'); save(); }
        switch (cmd)
        {
          case '': break;
          case 'help': print(HELP); break;
          case 'clear': out.innerHTML = ''; break;
          case 'pwd': print(T.cwd); break;
          case 'whoami': print('detective, salter & page — badge pending'); break;
          case 'date': print(new Date().toString()); break;
          case 'sudo': print('nice try. the agency owns the keys.', 'terr'); break;
          case 'coffee': print('the machine has been "out of order" since 1993.\nthe mug beside it is yours.', 'tdim'); break;
          case 'prisoner': print('THE PRISONER\u2019S DILEMMA, per the DA\u2019s worksheet:\n  flip+flip 5/5 . flip+hold 1/12 . hold+hold 2/2\nconfessing dominates. loyalty is the only counterweight.\nthe desk is where that gets expensive.', 'tdim'); break;
          case 'sysinfo': print(`MONOLITH OS 3.6 FIELD SHELL\nCPU: P-90 . RAM: 640K (PLENTY) . DRIVE: ${CASE().disk} (READ ONLY)\nDEEP INDEX: READY . PHOTO LAB: READY . PLEA DESK: READY`); break;
          case 'case': print(`CASE \u2116${CASE().no} — ${CASE().title} — ${state.solved.has(CASE().id) ? 'CLOSED' : 'OPEN'}`); break;
          case 'rank': {
            if (!Object.keys(state.score).length) { print('no closed cases yet. the agency is neutral, for now.', 'tdim'); break; }
            Object.entries(state.score).forEach(([ id, s ]) => {
              const c = CASES.find(x => x.id === id);
              print(`\u2116${c.no} ${c.title} — ${s.rank} (${s.score}/100, ${fmtDur(s.time)}${s.under ? ', under par' : ''}${s.plea ? ', plea:' + s.plea : ''})`);
            });
            break;
          }
          case 'hint': { const h = revealHint(); if (h) { print('AGENCY WIRE —', 'tdim'); print(h); } break; }
          case 'theme': {
            if (arg === 'green' || arg === 'amber') { state.settings.tint = arg; applySettings(); save(); print('phosphor set: ' + arg, 'tdim'); }
            else print('usage: theme amber|green', 'tdim');
            break;
          }
          case 'timeline': openTimeline(); print('opened: timeline', 'tdim'); break;
          case 'plea': openPleaDesk(); print('opened: plea desk', 'tdim'); break;
          case 'suspects':
            CASE().suspects.forEach((s, i) => print(s.name + ' — ' + stanceOf(i).t));
            break;
          case 'statements': {
            const dir = resolve('/Statements');
            if (!dir || !Object.keys(dir.children).length) { print('no signed statements on the drive yet.', 'tdim'); break; }
            print('INTERROGATION ROOM & PLEA DESK — signed papers:');
            Object.keys(dir.children).forEach(k => print('  /Statements/' + k));
            break;
          }
          case 'links': {
            const L = CASE().links || []; const got = state.links[ CASE().id ] || [];
            if (!L.length) { print('no cross-reference map for this case.', 'tdim'); break; }
            print(got.length + ' of ' + L.length + ' links verified:');
            got.forEach(i => print('  \u2022 ' + L[ i ].t));
            if (got.length < L.length) print((L.length - got.length) + ' still undiscovered — pin both ends of a connection.', 'tdim');
            break;
          }
          case 'history': T.hist.slice(-15).forEach((h, i) => print('  ' + (T.hist.length - Math.min(15, T.hist.length) + i + 1) + '  ' + h)); break;
          case 'trash': T.cwd = '/Trash'; check('trash'); prompt(); break;
          case 'log': state.log.slice(0, 12).forEach(e => print(e.t + '  \u2116' + e.c + '  ' + e.text)); if (!state.log.length) print('log empty.', 'tdim'); break;
          case 'note': if (arg) { state.notes.unshift({ id: Date.now(), text: arg }); save(); print('noted. see DESK NOTES.', 'tdim'); } else print('note: what?', 'terr'); break;
          case 'ev': {
            const list = evList();
            if (!list.length) { print('board empty.', 'tdim'); break; }
            list.forEach((p, i) => print('E-' + pad2(i + 1) + '  ' + p));
            break;
          }
          case 'pin': {
            if (!arg) { print('pin: operand required', 'terr'); break; }
            const p = normPath(T.cwd, arg); const n = resolve(p);
            if (!n || n.type === 'dir') { print('pin: no such file: ' + p, 'terr'); break; }
            if (!n.ev) { print('pin: nothing evidentiary in that file.', 'terr'); break; }
            if (addEvidence(p)) { print('pinned as exhibit ' + evNum(p) + ': ' + n.ev.title); toast('EVIDENCE PINNED', n.ev.title); }
            else print('pin: already on the board.', 'tdim');
            break;
          }
          case 'start': {
            const map = { case: () => openCaseFile(), disk: () => openFM(), search: openSearch, interro: openInterrogation, plea: openPleaDesk, timeline: openTimeline, log: openLog, notes: openNotes, about: openAbout, settings: openSettings, term: () => openTerminal() };
            if (map[ arg ]) { map[ arg ](); print('started: ' + arg, 'tdim'); } else print('start: unknown app — try case, disk, search, interro, plea, timeline, log, notes, about, settings', 'terr');
            break;
          }
          case 'grep': {
            if (!arg) { print('grep: term required', 'terr'); break; }
            const hits = searchDisk(arg, T.cwd, true);
            if (!hits.length) { print('grep: no matches for "' + arg + '"', 'tdim'); break; }
            print(hits.length + ' match' + (hits.length === 1 ? '' : 'es') + ':');
            hits.forEach(h => print('  ' + h.p + (h.sealed ? '  [SEALED]' : '')));
            print("use 'open <path>' to read.", 'tdim');
            break;
          }
          case 'cd': {
            const p = normPath(T.cwd, arg); const n = resolve(p);
            if (!n) print('cd: no such path: ' + p, 'terr');
            else if (n.type !== 'dir') print('cd: not a directory: ' + p, 'terr');
            else { T.cwd = p; if (p === '/Trash') check('trash'); prompt(); }
            break;
          }
          case 'ls': {
            const showAll = parts.includes('-a');
            const target = parts.filter(a => a !== '-a').join(' ');
            const p = normPath(T.cwd, target); const n = resolve(p);
            if (!n || n.type !== 'dir') { print('ls: no such directory: ' + p, 'terr'); break; }
            const keys = Object.keys(n.children).sort();
            let shown = 0;
            keys.forEach(k => {
              const ch = n.children[ k ];
              if (ch.hid && !showAll) return;
              shown++;
              if (ch.type === 'dir') prints(`<span style="color:var(--amber)">${esc(k)}/</span>`);
              else prints(`${esc(k)}  <span class="tdim">${nodeBytes(ch)}</span>`);
            });
            if (!shown) print('(empty — try ls -a)', 'tdim');
            break;
          }
          case 'cat': case 'open': {
            if (!arg) { print(cmd + ': operand required', 'terr'); break; }
            const p = normPath(T.cwd, arg); const n = resolve(p);
            if (!n) { print(cmd + ': no such file: ' + p, 'terr'); break; }
            if (n.type === 'dir') { print(cmd + ': is a directory: ' + p, 'terr'); break; }
            if (n.type === 'locked' && !isUnlocked(p)) { print('cat: ACCESS DENIED — file is sealed. Find the key on the disk.', 'terr'); break; }
            if (cmd === 'open') { openViewer(p, n); print('opened in viewer: ' + p, 'tdim'); break; }
            if (n.type === 'email') print(`FROM ${n.from}\nTO   ${n.to}\nDATE ${n.date}\nSUBJ ${n.subject}\n\n${n.body}`);
            else if (n.type === 'chat') n.entries.forEach(e => print('[' + e[ 0 ] + '] ' + e[ 1 ] + ': ' + e[ 2 ]));
            else if (n.type === 'image') print('[binary image — use: open ' + p + ']', 'tdim');
            else if (n.type === 'audio') print('[audio — use: open ' + p + ']', 'tdim');
            else if (n.type === 'frag') print(isRecovered(p) ? (n.head + '\n' + n.hidden.join('\n')) : n.head + '\n[...shredded — deep scan required: open in viewer...]');
            else print(n.content);
            break;
          }
          case 'exit': closeWin('term'); break;
          case 'reset': if (arg === 'confirm') { localStorage.removeItem(SAVE_KEY); location.reload(); } else print('reset confirm — this wipes all progress. Type it fully to proceed.', 'terr'); break;
          default: print(cmd + ': command not found — try help', 'terr'); Snd.err();
        }
      };
      inp.addEventListener('keydown', e => {
        if (e.key === 'Tab')
        {
          e.preventDefault();
          const v = inp.value;
          const m = /(\S*)$/.exec(v); const tok = m[ 1 ];
          const slash = tok.lastIndexOf('/');
          const dirPart = slash >= 0 ? tok.slice(0, slash + 1) : '';
          const pre = slash >= 0 ? tok.slice(slash + 1) : tok;
          const base = normPath(T.cwd, dirPart || '.');
          const dn = resolve(base);
          if (dn && dn.type === 'dir')
          {
            const names = Object.keys(dn.children)
              .filter(k => k.toLowerCase().startsWith(pre.toLowerCase()))
              .filter(k => pre.startsWith('.') || !dn.children[ k ].hid)
              .sort();
            if (names.length === 1)
            {
              const nn = names[ 0 ];
              const add = dn.children[ nn ].type === 'dir' ? '/' : ' ';
              inp.value = v.slice(0, v.length - tok.length) + dirPart + nn + add;
            } else if (names.length > 1)
            {
              prints(`<span class="techo">${esc(ps1.textContent)} ${esc(v)}</span>`);
              print(names.join('   '), 'tdim');
            }
          }
          return;
        }
        if (e.key.length === 1) Snd.key();
        if (e.key === 'Enter')
        {
          const v = inp.value; inp.value = '';
          prints(`<span class="techo">${esc(ps1.textContent)} ${esc(v)}</span>`);
          if (v.trim()) { T.hist.push(v); T.hi = T.hist.length; }
          run(v);
        } else if (e.key === 'ArrowUp') { if (T.hi > 0) { T.hi--; inp.value = T.hist[ T.hi ] || ''; } e.preventDefault(); }
        else if (e.key === 'ArrowDown') { if (T.hi < T.hist.length) { T.hi++; inp.value = T.hist[ T.hi ] || ''; } e.preventDefault(); }
      });
    }

    function mountCase(id) {
      state.case = id;
      closeAll(); closeMenu(); $('#drawer').classList.remove('open');
      interSel = 0; pleaSel = 0;
      const c = CASE();
      injectStatements();
      if (!state.t0[ c.id ]) state.t0[ c.id ] = Date.now();
      $('#caseBtn').innerHTML = ic('case') + ' CASE \u2116' + c.no + ' — ' + c.title;
      $('#wm-n').textContent = '\u2116' + c.no;
      $('#shelfCount').textContent = state.done.size + '/' + CASES.length;
      refreshEvUI();
      toast('DRIVE MOUNTED', 'EVIDENCE IMAGE "' + c.disk + '" attached — read only. See CASE FILE for the brief.');
      addLog('Mounted ' + c.disk + ' — case \u2116' + c.no);
      openCaseFile();
    }
    $('#caseBtn').onclick = e => {
      e.stopPropagation();
      const old = $('#caseMenu'); if (old) { old.remove(); return; }
      const m = document.createElement('div'); m.id = 'caseMenu';
      m.style.cssText = 'position:fixed;top:42px;left:12px;z-index:700;background:var(--panel);border:1px solid var(--line);box-shadow:6px 7px 0 rgba(0,0,0,.45);min-width:330px';
      CASES.forEach((c, i) => {
        const sv = state.solved.has(c.id), dn = state.done.has(c.id);
        const locked = i > 0 && !state.done.has(CASES[ i - 1 ].id);
        const b = document.createElement('button'); b.className = 'btn';
        b.style.cssText = 'width:100%;border:none;background:none;justify-content:flex-start;padding:10px 12px;' + (locked ? 'opacity:.45' : '');
        b.innerHTML = `${ic(locked ? 'lock' : (sv ? 'check' : 'case'))} \u2116${c.no} ${c.title}
      <span style="margin-left:auto;font-size:9px;letter-spacing:.14em">${locked ? 'SEALED' : (sv ? 'CLOSED' : (dn ? 'REOPEN' : 'OPEN'))}${!locked ? ' \u00b7 EV ' + (state.ev[ c.id ] || []).length + '/' + countEv(c) : ''}</span>`;
        b.onclick = () => { m.remove(); if (locked) { toast('FILE SEALED', 'Close the previous case to earn this one.', true); Snd.err(); return; } mountCase(c.id); };
        m.appendChild(b);
      });
      document.body.appendChild(m);
    };
    document.addEventListener('click', e => { const m = $('#caseMenu'); if (m && !e.target.closest('#caseMenu')) m.remove(); });

    function buildIcons() {
      const list = [
        [ 'case', 'CASE FILE', () => openCaseFile() ],
        [ 'drive', 'DISK MANAGER', () => openFM() ],
        [ 'search', 'DEEP INDEX', openSearch ],
        [ 'chat', 'INTERROGATION', openInterrogation ],
        [ 'scale', 'PLEA DESK', openPleaDesk ],
        [ 'clock', 'TIMELINE', openTimeline ],
        [ 'term', 'TERMINAL', openTerminal ],
        [ 'book', 'FIELD LOG', openLog ],
        [ 'note', 'DESK NOTES', openNotes ],
        [ 'trash', 'TRASH', () => openFM('/Trash') ],
        [ 'info', 'ABOUT', openAbout ],
      ];
      const host = $('#icons');
      list.forEach(([ icn, label, fn ]) => {
        const d = document.createElement('div'); d.className = 'dicon';
        d.innerHTML = ic(icn) + `<span>${label}</span>`;
        d.onclick = () => { if (d.classList.contains('sel')) { d.classList.remove('sel'); fn(); } else { document.querySelectorAll('.dicon').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); Snd.click(); } };
        host.appendChild(d);
      });
    }
    buildIcons();

    $('#desktop').addEventListener('contextmenu', e => {
      if (e.target.closest('.win')) return;
      e.preventDefault();
      openCtx(e.clientX, e.clientY, [
        { l: 'NEW NOTE', i: 'note', fn: openNotes },
        { l: 'DISK MANAGER', i: 'drive', fn: () => openFM() },
        { l: 'INTERROGATION', i: 'chat', fn: openInterrogation },
        { l: 'PLEA DESK', i: 'scale', fn: openPleaDesk },
        { l: 'TIMELINE', i: 'clock', fn: openTimeline },
        { l: 'TERMINAL', i: 'term', fn: openTerminal },
        { sep: 1 },
        { l: 'ABOUT MONOLITH', i: 'info', fn: openAbout },
        { l: 'SETTINGS', i: 'gear', fn: openSettings },
        { sep: 1 },
        { l: 'RESET INVESTIGATION', i: 'trash', fn: confirmReset },
      ]);
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape')
      {
        if (ctxEl) { closeCtx(); return; }
        if ($('#modal-root').classList.contains('show')) { closeModal(); return; }
        if (menuEl) { closeMenu(); return; }
        if (document.activeElement && document.activeElement.matches('input,textarea')) { document.activeElement.blur(); return; }
        const caseMenu = $('#caseMenu'); if (caseMenu) { caseMenu.remove(); return; }
        if (wm.active) closeWin(wm.active);
        return;
      }
      if (wm.active === 'fm' && wm.wins.has('fm') && !e.target.closest('input,textarea'))
      {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp')
        {
          e.preventDefault();
          const list = fmState.order; if (!list.length) return;
          let i = list.indexOf(fmState.sel);
          i = e.key === 'ArrowDown' ? Math.min(i + 1, list.length - 1) : Math.max(i - 1, 0);
          if (i < 0) i = 0;
          fmState.sel = list[ i ]; renderList();
          const row = wm.wins.get('fm').el.querySelector('.row.sel');
          if (row) row.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter' && fmState.sel)
        {
          activate(fmState.sel);
        } else if (e.key === 'Backspace')
        {
          e.preventDefault();
          fmNav(normPath(fmState.cwd, '..'));
        }
      }
    });

    function tick() { const d = new Date(); $('#clock').textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
    tick(); setInterval(tick, 15000);

    applySettings();
    refreshEvUI();
    $('#shelfCount').textContent = state.done.size + '/' + CASES.length;

    /* =========================================================
       BOOT SEQUENCE
       ========================================================= */
    (function boot() {
      const log = $('#bootlog'), hint = $('#boothint');
      const closed = state.done.size;
      const lines = [
        'MONOLITH FIELD SHELL v3.6',
        'SALTER & PAGE SYSTEMS — (C) 1994',
        '',
        'POST ......................... OK',
        'MEMORY 640K .................. OK (PLENTY)',
        'MOUNTING EVIDENCE DRIVE ...... OK',
        'HASH CHAIN ................... VERIFIED',
        'DEEP INDEX ................... READY',
        'PHOTO LAB .................... READY',
        'INTERROGATION SUITE .......... READY',
        'PLEA DESK .................... READY (DA ON LINE 2)',
        'CASE DOSSIER ................. 6 FILES / ' + closed + ' CLOSED',
        'PRINTER ...................... OUT OF TONER (AS USUAL)',
        '',
        'GOOD MORNING, DETECTIVE.',
      ];
      let i = 0, done = false, timers = [];
      const kf = () => finish();
      function finish() {
        if (done) return; done = true;
        timers.forEach(clearTimeout);
        removeEventListener('keydown', kf);
        const b = $('#boot'); if (!b) return;
        b.classList.add('off');
        setTimeout(() => b.remove(), 600);
        let start = CASES[ 0 ].id;
        for (const c of CASES) { if (!state.solved.has(c.id)) { start = c.id; break; } start = c.id; }
        mountCase(start);
      }
      $('#boot').addEventListener('click', finish);
      addEventListener('keydown', kf);
      function next() {
        if (i < lines.length)
        {
          log.textContent += lines[ i ] + '\n';
          i++;
          timers.push(setTimeout(next, i < 3 ? 180 : 110 + Math.random() * 160));
        } else
        {
          hint.classList.add('show');
          timers.push(setTimeout(finish, 4500));
        }
      }
      timers.push(setTimeout(next, 350));
    })();
  </script>
</body>

</html>
